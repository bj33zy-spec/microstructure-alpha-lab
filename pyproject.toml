[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "microstructure-alpha-lab"
version = "0.1.0"
description = "Walk-forward research framework for limit-order-book alpha in NQ/MNQ and other liquid markets"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = []
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
plots = ["matplotlib>=3.7"]

[project.scripts]
lobalpha = "lobalpha.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
